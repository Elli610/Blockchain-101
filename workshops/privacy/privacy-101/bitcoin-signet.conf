# bitcoind configuration for the Privacy 101 workshop: a signet node using
# as little disk space as possible on a laptop.
#
# Usage (the path must be absolute):
#   bitcoind -conf=/path/to/privacy-101/bitcoin-signet.conf -daemon
#   bitcoin-cli -conf=/path/to/privacy-101/bitcoin-signet.conf getblockchaininfo
#
# Data is stored in the signet subfolder of the Bitcoin data directory:
#   Linux    ~/.bitcoin/signet
#   macOS    ~/Library/Application Support/Bitcoin/signet
#   Windows  %APPDATA%\Bitcoin\signet
# Delete that folder after the workshop to get the space back.

# Signet: coins have no value.
signet=1

# Accept RPC commands (bitcoin-cli, payjoin-cli, JoinMarket).
server=1

# Keep at most 550 MB of block files, the minimum allowed. Older blocks are
# deleted once validated. The node still validates the whole chain and can
# run wallets created after it started.
prune=550

# Optional indexes cost disk space and are not needed here. txindex is also
# incompatible with pruning.
txindex=0
blockfilterindex=0
coinstatsindex=0

[signet]
# Used by payjoin-cli and JoinMarket. RPC only listens on localhost.
rpcuser=workshop
rpcpassword=workshop
