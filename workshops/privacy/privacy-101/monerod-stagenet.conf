# monerod configuration for the Privacy 101 workshop: a stagenet node using
# as little disk space as possible on a laptop.
#
# Usage:
#   ./monerod --config-file /path/to/privacy-101/monerod-stagenet.conf
#
# Data is stored in ~/.bitmonero/stagenet (Linux and macOS) or
# C:\ProgramData\bitmonero\stagenet (Windows). Delete that folder after the
# workshop to get the space back.

# Stagenet: coins have no value.
stagenet=1

# Keep only a fraction of the data needed to verify old transactions. A
# pruned node still validates everything, serves your wallet and can mine.
prune-blockchain=1

# Download blocks already pruned instead of downloading them in full and
# pruning them afterwards. Saves bandwidth and temporary disk space.
sync-pruned-blocks=1

# Logs: one file of 10 MB at most, instead of the default 50 files of 100 MB.
log-level=0
max-log-file-size=10485760
max-log-files=1
